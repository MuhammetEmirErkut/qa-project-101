# Gauge Java Runner Configuration
# Specify custom classpath or JVM arguments

# Path to custom screenshot grabber class
gauge_custom_screenshot_grabber = com.hepsiburada.qa.hooks.CustomScreenshotGrabber

# Gauge custom build paths (Maven & Gradle)
gauge_custom_build_path = target/classes, target/test-classes, build/classes/java/main, build/classes/java/test, build/test-classes

# Gauge custom classpath for external libraries / JARs
gauge_custom_classpath = libs/*, target/dependency/*, build/libs/*

# Additional JVM arguments if required
gauge_jvm_args = -Dfile.encoding=UTF-8
