plugins {
    id 'java'
    id 'io.qameta.allure' version '2.12.0'
    id 'org.gauge' version '3.2.0'
}

group = 'com.hepsiburada.qa'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

def seleniumVersion = '4.21.0'
def testngVersion = '7.10.2'
def allureVersion = '2.27.0'
def ownerVersion = '1.0.12'
def log4jVersion = '2.23.1'
def jacksonVersion = '2.17.1'
def lombokVersion = '1.18.32'
def restassuredVersion = '5.4.0'
def assertjVersion = '3.25.3'
def gaugeVersion = '0.11.1'

dependencies {
    // ==================== SELENIUM WEBDRIVER & APPIUM ====================
    implementation "org.seleniumhq.selenium:selenium-java:${seleniumVersion}"
    implementation "io.appium:java-client:9.2.2"

    // ==================== TEST RUNNERS (TESTNG & GAUGE) ====================
    testImplementation "org.testng:testng:${testngVersion}"
    testImplementation "com.thoughtworks.gauge:gauge-java:${gaugeVersion}"

    // ==================== REPORTING (ALLURE) ====================
    implementation "io.qameta.allure:allure-testng:${allureVersion}"
    testImplementation "io.qameta.allure:allure-rest-assured:${allureVersion}"

    // ==================== API AUTOMATION & ASSERTIONS ====================
    testImplementation "io.rest-assured:rest-assured:${restassuredVersion}"
    testImplementation "io.rest-assured:json-path:${restassuredVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"

    // ==================== CONFIGURATION & TEST DATA ====================
    implementation "org.aeonbits.owner:owner:${ownerVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    // ==================== LOGGING (LOG4J2 & SLF4J) ====================
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    implementation "org.apache.logging.log4j:log4j-api:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:${log4jVersion}"
}

test {
    useTestNG() {
        suites 'testng.xml'
    }
    systemProperty 'allure.results.directory', "${layout.buildDirectory.get()}/allure-results"
    testLogging {
        events "passed", "skipped", "failed"
    }
}

allure {
    version = allureVersion
    autoconfigure = true
    aspectjweaver = true
}

gauge {
    specsDir = project.findProperty('specsDir') ?: 'specs'
    inParallel = false
    nodes = 2
}

tasks.register('copyDependencies', Copy) {
    from configurations.testRuntimeClasspath
    into layout.projectDirectory.dir('libs')
}
