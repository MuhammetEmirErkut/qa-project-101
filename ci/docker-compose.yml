services:
  # =============================================================================
  # 1. Jenkins CI/CD Controller
  # =============================================================================
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins-qa
    user: root
    privileged: true
    ports:
      - "8080:8080"   # Jenkins Web UI
      - "50000:50000" # Jenkins Agent Port
    environment:
      - JAVA_OPTS=-Dhudson.model.DirectoryBrowserSupport.CSP=
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - qa-network

  # =============================================================================
  # 2. Selenium Grid Hub (Webdriver Router)
  # =============================================================================
  selenium-hub:
    image: selenium/hub:4.21.0
    container_name: selenium-hub
    ports:
      - "4444:4444"   # Selenium Grid Webdriver Endpoint & UI
    environment:
      - GRID_MAX_SESSION=16
      - GRID_BROWSER_TIMEOUT=120
      - GRID_TIMEOUT=120
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - qa-network

  # =============================================================================
  # 3. Chrome Browser Node (with Live VNC stream on port 7900)
  # =============================================================================
  chrome-node:
    image: selenium/node-chrome:4.21.0
    container_name: selenium-node-chrome
    shm_size: 2gb
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=4
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - SCREEN_DEPTH=24
    ports:
      - "7900:7900"   # Live Browser Stream: http://localhost:7900 (pwd: secret)
    networks:
      - qa-network

  # =============================================================================
  # 4. Firefox Browser Node
  # =============================================================================
  firefox-node:
    image: selenium/node-firefox:4.21.0
    container_name: selenium-node-firefox
    shm_size: 2gb
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=4
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - SCREEN_DEPTH=24
    networks:
      - qa-network

  # =============================================================================
  # 5. Mock E-Commerce API (for Isolated Performance & Load Tests)
  # =============================================================================
  mock-api:
    build:
      context: ../performance-test/mock-api
      dockerfile: Dockerfile
    container_name: mock-ecommerce-api
    ports:
      - "3001:3001"   # Mock REST API Endpoint: http://localhost:3001
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); });\""]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - qa-network

networks:
  qa-network:
    name: qa-network
    driver: bridge

volumes:
  jenkins_home:
